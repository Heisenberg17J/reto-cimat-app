[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reto-cimat-nucleo"
version = "0.1.0"
description = "Nucleo de analisis (segmentacion + radiomica + pronostico) del reto CIMAT / BraTS 2018. Prototipo de investigacion, no clinico."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",            # PyRadiomics 3.0.1 no funciona con numpy 2
    "scipy==1.14.1",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scikit-survival==0.23.1",  # el modelo .joblib se guardo con esta version
    "SimpleITK==2.5.6",
    "nibabel==5.3.2",
    "PyYAML",
    "joblib",
    "matplotlib",
    # pyradiomics==3.0.1 se instala aparte (ver README): necesita compilarse contra numpy 1.26
]

[project.optional-dependencies]
segmentacion = ["torch", "nnunetv2==2.8.1"]
backend = ["fastapi", "uvicorn[standard]", "python-multipart"]
pruebas = ["pytest", "httpx"]

[project.scripts]
reto-cimat-analizar = "nucleo.cli:main"
reto-cimat-servidor = "backend.servidor:main"

[tool.setuptools]
packages = ["nucleo", "backend"]

[tool.setuptools.package-data]
backend = ["estatico/*", "pesos_manifiesto.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*deprecated.*"]
